<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <!-- ЗАДАЧА 4-->
    <section class="task-section">
        <div class="dashboard">
            <aside class="sidebar">
                <nav class="sidebar-menu">
                    <a href="#">Профиль</a>
                    <a href="#">Заказы</a>
                    <a href="#">Сообщения</a>
                    <a href="#">Настройки</a>
                </nav>
            </aside>
            <main class="dashboard-main">
                <div class="dashboard-header">
                    <h3>Добро пожаловать, Влад!</h3>
                    <button class="primary">Новый заказ</button>
                </div>
                <div class="stats">
                    <div class="stat-card">Заказов: 12</div>
                    <div class="stat-card">Сообщений: 5</div>
                    <div class="stat-card">Бонусов: 450 ₽</div>
                </div>
                <div class="task-list">
                    <div class="task-item">Оформить заказ #1234</div>
                    <div class="task-item">Ответить клиенту</div>
                    <div class="task-item">Обновить профиль</div>
                </div>
            </main>
        </div>
    </section>
     <section class="task-section">
        <div class="interface-rows">
            <div class="row cart-row">
                <div class="row-left">🛒Мышь игровая</div>
                <div class="row-right">4 990 ₽ | <button class="small-btn">Удалить</button></div>
            </div>
            <div class="row user-row">
                <div class="row-left">👤Влад Никифоров</div>
                <div class="row-right">Активен | <button class="small-btn">Написать</button></div>
            </div>
            <div class="row notification-row">
                <div class="row-left">🔔Вам начислено 1000000 бонусов!</div>
                <div class="row-right">5 мин назад</div>
            </div>
            <div class="row order-row">
                <div class="row-left">📦Заказ №676767</div>
                <div class="row-right">Статус: доставлен | <button class="small-btn">Повторить</button></div>
            </div>
        </div>
    </section>
</body>
</html>
