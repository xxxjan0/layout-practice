<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="3.css">
    <title>3 Карточки</title>
</head>
<body>

<div class="cards-container">
    <div class="card user-card">
        <div class="icon">👤</div>
        <h3>Владислав Никифоров</h3>
        <p>Веб-разработчик</p>
        <div class="other">Ректор СахГУ</div>
        <a href="#" class="card-btn">Написать сообщение</a>
    </div>

    <div class="card product-card">
        <div class="icon">💻</div>
        <h3>Ноутбук Lenovo</h3>
        <p>Топовый ноутбук 1050 ti</p>
        <div class="other">Цена: 4 990 ₽</div>
        <button class="card-btn">В корзину</button>
    </div>

    <div class="card article-card">
        <div class="icon">ⓘ</div>
        <h3>50 причин не работать в IT</h3>
        <p><strong>НЕ ИДИ В IT</strong>, пока не прочитаешь эту статью</p>
        <div class="other">5 мин чтения</div>
        <a href="#" class="card-btn">Читать статью</a>
    </div>
</div>

</body>
</html>
