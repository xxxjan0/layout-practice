<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Flexbox компоновка интерфейса</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЗАДАЧА 1-->
    <section class="task-section">
        <header class="header">
            <div class="logo">ПЕРЕДОЗ БАНК</div>
            <nav class="nav">
                <a href="#">Главная</a>
                <a href="#">О нас</a>
                <a href="#">Услуги</a>
                <a href="#">Портфолио</a>
                <a href="#">Контакты</a>
            </nav>
            <div class="search-wrapper">
                <input type="text" placeholder="Поиск..." class="search-input">
            </div>
            <a href="lk.html"><button class="login-btn">Войти в ЛК</button></a>
        </header>
    </section>

    <!-- ЗАДАЧА 2 -->
    <section class="task-section">
        <div class="control-panel">
            <h3>Управление заказами</h3>
            <div class="panel-actions">
                <input type="text" placeholder="Поиск по заказам..." class="search-small">
                <button class="secondary">Фильтр</button>
                <button class="secondary">Экспорт</button>
                <button class="primary">Создать</button>
            </div>
        </div>
    </section>

    <!-- ЗАДАЧА 3-->
    <section class="task-section">
        <div class="product-card">
            <div class="product-top">
                <img class="product-image" src="https://t4.ftcdn.net/jpg/06/92/56/91/360_F_692569115_XoAhm82FDJaxQfxAfHNq3QfTY9yCZrZZ.jpg" alt="">
                <div class="product-info">
                    <h3>Игровая мышь</h3>
                    <p>Описание: беспроводная, 16000 dpi, подсветка, 8 кнопок</p>
                </div>
            </div>
            <div class="product-mid">
                <div class="rating">⭐ 4.8 (12000 отзывов)</div>
            </div>
            <div class="product-bottom">
                <div class="price">3 990 ₽</div>
                <div class="action-buttons">
                    <button class="secondary">В корзину</button>
                    <button class="primary">Купить</button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
